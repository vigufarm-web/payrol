<!doctype html><html lang="id"><meta charset="utf-8"><link rel="stylesheet" href="../css/style.css"><body><main style="padding:20px"><p>DATA UJI LOKAL · tidak disimpan ke GitHub</p><h1>Peringatan input HK berulang</h1><p>Sudah tercatat 0,5 HK. Input 0,5 HK berikutnya wajib dikonfirmasi.</p><button id="half">Tambah 0,5 HK</button> <button id="over">Tambah 0,6 HK</button><p id="result">1 baris · 0,5 HK</p></main><script type="module">
import * as D from '../js/data.js';import * as schema from '../js/skema-payroll.js';D.pakaiSkema(schema.TABEL,schema.REF);import {confirmHKEntries} from '../js/hk-entry-confirm.js';import {singleSave} from '../js/hk-entry-check.js';
D.state.aplikasi='PayrollHK';D.state.data={aplikasi:'PayrollHK',web:{},tabel:{employees:[{id:1,nama:'PEKERJA UJI'}],divisions:[{id:1,nama_divisi:'Kantor'}],blocks:[{id:1,nama_blok:'Kantor'}],job_types:[{id:1,nama_jenis:'OG PH'}],daily_payroll:[{id:1,employee_id:1,tanggal:'2026-10-20',hk:.5,division_id:1,block_id:1,job_type_id:1,nominal:40000}],app_settings:[]}};
for(const [id,hk] of [['half',.5],['over',.6]])document.getElementById(id).onclick=singleSave(async()=>{const row={employee_id:1,tanggal:'2026-10-20',division_id:1,block_id:1,job_type_id:1,hk,nominal:hk*80000};try{if(!await confirmHKEntries([row])){document.getElementById('result').textContent='Dibatalkan · tetap '+D.baris('daily_payroll').length+' baris';return;}D.tambah('daily_payroll',row);document.getElementById('result').textContent=D.baris('daily_payroll').length+' baris · '+D.baris('daily_payroll').reduce((s,r)=>s+r.hk,0)+' HK';}catch(e){document.getElementById('result').textContent=e.message+' Data tetap '+D.baris('daily_payroll').length+' baris.';}});
</script></body></html>
